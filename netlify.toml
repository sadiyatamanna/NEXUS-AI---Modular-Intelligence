# Netlify Build & Routing Configuration for NEXUS AI
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback: Route all frontend paths (like /chat, /docs) to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
